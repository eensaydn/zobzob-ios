name: Sinav
options:
  bundleIdPrefix: com.zobzob
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  defaultConfig: Debug
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Sinav:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Sinav
        excludes: ["Resources/Info.plist"]
    resources:
      - Sources/Sinav/Resources/Assets.xcassets
    info:
      path: Sources/Sinav/Resources/Info.plist
      properties:
        CFBundleDisplayName: ZoB ZoB
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIRequiresFullScreen: false
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - tr
          - en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zobzob.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
